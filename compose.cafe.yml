services:
  cafe-api:
    image: cafe-os-api:${CAFE_API_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/cafe-api/Dockerfile
    env_file:
      - ./runtime/cafe-api.env
    restart: unless-stopped
    networks:
      - supabase
    ports:
      - "127.0.0.1:${CAFE_API_PORT:-8100}:8100"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8100/healthz').then(r => {
            if (!r.ok) process.exit(1)
          }).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  supabase:
    external: true
    name: supabase_default
